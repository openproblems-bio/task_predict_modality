__merge__: ../../../api/comp_method_predict.yaml
name: babel_predict
info:
  # babel is Multiome-only (ATAC->GEX). Point the component test at bmmc_multiome/swap
  # (mod1=ATAC) and the pre-trained babel model committed under models/babel, matching
  # how novel/simple_mlp wire their predict tests.
  test_setup:
    multiome:
      input_test_mod1: resources_test/task_predict_modality/openproblems_neurips2021/bmmc_multiome/swap/test_mod1.h5ad
      input_train_mod2: resources_test/task_predict_modality/openproblems_neurips2021/bmmc_multiome/swap/train_mod2.h5ad
      input_model: resources_test/task_predict_modality/openproblems_neurips2021/bmmc_multiome/swap/models/babel/output_model.pkl
resources:
  - path: script.py
    type: python_script
  - path: ../model.py
    dest: model.py
engines:
  - type: docker
    image: openproblems/base_pytorch_nvidia:1
    setup:
      - type: python
        packages:
          - scikit-learn>=1.1
runners:
  - type: executable
  - type: nextflow
    directives:
      label: [highmem, hightime, midcpu, gpu]
# Override the api default (bmmc_cite) — babel only supports Multiome GEX<->ATAC.
# Also copies the pre-trained model referenced by test_setup.input_model above.
test_resources:
  - type: python_script
    path: /common/component_tests/run_and_check_output.py
  - path: /resources_test/task_predict_modality/openproblems_neurips2021/bmmc_multiome/swap
    dest: resources_test/task_predict_modality/openproblems_neurips2021/bmmc_multiome/swap
