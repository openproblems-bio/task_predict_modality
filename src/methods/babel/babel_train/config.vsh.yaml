__merge__: ../../../api/comp_method_train.yaml
name: babel_train
resources:
  - path: script.py
    type: python_script
  - path: ../model.py
    dest: model.py
  - path: ../losses.py
    dest: losses.py
  - path: ../chrom_utils.py
    dest: chrom_utils.py
arguments:
  - name: "--hidden_dim"
    type: integer
    default: 16
    description: Latent dimensionality of the shared encoder/decoder bottleneck.
  - name: "--nn_epochs"
    type: integer
    default: 100
    description: Maximum training epochs (early stopping applies).
  - name: "--lr"
    type: double
    default: 0.001
    description: Adam learning rate.
  - name: "--batch_size"
    type: integer
    default: 64
    description: Training batch size.
  - name: "--loss2_weight"
    type: double
    default: 3.0
    description: Relative weight of the ATAC (BCE) loss terms versus the RNA (negative binomial) loss terms.
  - name: "--early_stopping_patience"
    type: integer
    default: 20
    description: Epochs without validation loss improvement before stopping early.
engines:
  - type: docker
    image: openproblems/base_pytorch_nvidia:1
    setup:
      - type: python
        packages:
          - skorch>=0.15
          - scanpy>=1.9
          - scikit-learn>=1.1
runners:
  - type: executable
  - type: nextflow
    directives:
      label: [highmem, hightime, midcpu, gpu]
