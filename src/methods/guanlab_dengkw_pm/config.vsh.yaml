__merge__: ../../api/comp_method.yaml
name: guanlab_dengkw_pm
label: Guanlab-dengkw
summary: A kernel ridge regression method with RBF kernel. 
description: |
  This is a solution developed by Team Guanlab - dengkw in the Neurips 2021 competition to predict one modality
  from another using kernel ridge regression (KRR) with RBF kernel. Truncated SVD is applied on the combined
  training and test data from modality 1 followed by row-wise z-score normalization on the reduced matrix. The
  truncated SVD of modality 2 is predicted by training a KRR model on the normalized training matrix of modality 1.
  Predictions on the normalized test matrix are then re-mapped to the modality 2 feature space via the right
  singular vectors.
references:
  doi: 10.1101/2022.04.11.487796
links:
  documentation: https://github.com/openproblems-bio/neurips2021_multimodal_topmethods/tree/main/src/predict_modality/methods/Guanlab-dengkw
  repository: https://github.com/openproblems-bio/neurips2021_multimodal_topmethods/tree/main/src/predict_modality/methods/Guanlab-dengkw
info:
  preferred_normalization: log_cp10k
  competition_submission_id: 170636
arguments:
  - name: "--n_repeats"
    type: "integer"
    default: 5
    description: |
      Number of times the batches are reshuffled into two halves. Each half fits one
      kernel ridge model, so the consensus averages `2 * n_repeats` predictions.
    info:
      test_default: 1
  - name: "--seed"
    type: "integer"
    default: 1000
    description: Seed for the batch reshuffling.
resources:
  - type: python_script
    path: script.py
  - path: /src/utils/exit_codes.py
engines:
  - type: docker
    image: openproblems/base_python:1
    setup:
      - type: python
        packages: 
          - scikit-learn
          - pandas
          - numpy
runners:
  - type: executable
  - type: nextflow
    directives:
      label: [hightime, highmem, highcpu]
