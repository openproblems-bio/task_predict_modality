__merge__: ../../../api/comp_method_train.yaml
name: senkin_tmp_train
info:
  # The api default test inputs are bmmc_cite/swap (ADT->GEX). senkin predicts protein
  # (ADT) from RNA (GEX), so point the component test at the 'normal' (GEX->ADT)
  # direction, otherwise the new modality guard correctly exits non-applicable.
  test_setup:
    normal_direction:
      input_train_mod1: resources_test/task_predict_modality/openproblems_neurips2021/bmmc_cite/normal/train_mod1.h5ad
      input_train_mod2: resources_test/task_predict_modality/openproblems_neurips2021/bmmc_cite/normal/train_mod2.h5ad
      input_test_mod1: resources_test/task_predict_modality/openproblems_neurips2021/bmmc_cite/normal/test_mod1.h5ad
resources:
  - path: script.py
    type: python_script
  - path: /src/utils/exit_codes.py
arguments:
  - name: "--n_folds"
    type: integer
    default: 5
    description: Number of cross-validation folds for LightGBM and neural network training.
  - name: "--lgbm_boost_rounds"
    type: integer
    default: 10000
    description: Maximum LightGBM boosting rounds (early stopping applies).
    info:
      test_default: 50
  - name: "--lgbm_early_stopping"
    type: integer
    default: 100
    description: LightGBM early stopping patience (rounds without improvement).
    info:
      test_default: 10
  - name: "--nn_epochs"
    type: integer
    default: 100
    description: Maximum neural network training epochs (early stopping applies).
    info:
      test_default: 2
  - name: "--n_tsvd_components"
    type: integer
    default: 100
    description: TSVD components for reducing LightGBM predictions before NN input.
engines:
  - type: docker
    image: nvidia/cuda:12.8.1-cudnn-runtime-ubuntu24.04
    setup:
      - type: apt
        packages: [python3, python3-venv, procps, git, libgomp1]
      - type: docker
        run: python3 -m venv /opt/venv
      - type: docker
        env: [PATH=/opt/venv/bin:$PATH]
      - type: python
        packages:
          - tensorflow[and-cuda]>=2.20
          - anndata
          - scanpy
          - pyyaml
          - requests
          - jsonschema
          - lightgbm>=4.0
          - scikit-learn>=1.1
          - mudata>=0.2
          - muon>=0.1
          - fast-array-utils
        github:
          - openproblems-bio/core#subdirectory=packages/python/openproblems
      - type: docker
        run: pip install --no-cache-dir --no-deps git+https://github.com/lueckenlab/senkin-tmp-cite-pred.git
runners:
  - type: executable
  - type: nextflow
    directives:
      label: [highmem, hightime, midcpu, gpu]
# Override the api default (bmmc_cite/swap = ADT->GEX). senkin only supports GEX->ADT.
test_resources:
  - type: python_script
    path: /common/component_tests/run_and_check_output.py
  - path: /resources_test/task_predict_modality/openproblems_neurips2021/bmmc_cite/normal
    dest: resources_test/task_predict_modality/openproblems_neurips2021/bmmc_cite/normal
