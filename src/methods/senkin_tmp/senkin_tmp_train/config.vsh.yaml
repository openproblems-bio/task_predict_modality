__merge__: ../../../api/comp_method_train.yaml
name: senkin_tmp_train
info:
  # The api default test inputs are bmmc_cite/swap (ADT->GEX). senkin predicts protein
  # (ADT) from RNA (GEX), so point the component test at the 'normal' (GEX->ADT)
  # direction, otherwise the new modality guard correctly exits non-applicable.
  test_setup:
    normal_direction:
      input_train_mod1: resources_test/task_predict_modality/openproblems_neurips2021/bmmc_cite/normal/train_mod1.h5ad
      input_train_mod2: resources_test/task_predict_modality/openproblems_neurips2021/bmmc_cite/normal/train_mod2.h5ad
      input_test_mod1: resources_test/task_predict_modality/openproblems_neurips2021/bmmc_cite/normal/test_mod1.h5ad
resources:
  - path: script.py
    type: python_script
  - path: /src/utils/exit_codes.py
arguments:
  - name: "--n_folds"
    type: integer
    default: 5
    description: Number of cross-validation folds for the neural networks (one network per fold, predictions averaged).
  - name: "--lgbm_n_folds"
    type: integer
    default: 5
    description: |
      Number of cross-validation folds for the LightGBM models, whose out-of-fold predictions are
      features of the neural networks. Fewer folds cut the LightGBM time proportionally at a small
      cost in the quality of these features.
  - name: "--lgbm_boost_rounds"
    type: integer
    default: 10000
    description: Maximum LightGBM boosting rounds (early stopping applies).
    info:
      test_default: 50
  - name: "--lgbm_early_stopping"
    type: integer
    default: 100
    description: LightGBM early stopping patience (rounds without improvement).
    info:
      test_default: 10
  - name: "--nn_epochs"
    type: integer
    default: 100
    description: Maximum neural network training epochs (early stopping applies).
    info:
      test_default: 2
  - name: "--n_tsvd_components"
    type: integer
    default: 100
    description: TSVD components for reducing LightGBM predictions before NN input.
  - name: "--lgbm_learning_rate"
    type: double
    default: 0.01
    description: |
      LightGBM learning rate. The original solution used 0.01 with up to 10000 rounds, which takes
      days on the benchmark datasets; a higher rate with fewer rounds reaches the same LightGBM
      quality in a fraction of the time.
  - name: "--lgbm_max_bin"
    type: integer
    default: 63
    description: |
      Number of histogram bins per feature in LightGBM (library default 255). 63 halves the memory
      of the binned whole-transcriptome inputs held by every worker process (3 instead of 6.6 GB per
      fold on the NeurIPS 2022 CITE data) at identical validation loss and slightly faster rounds.
  - name: "--lgbm_n_jobs"
    type: integer
    default: -1
    description: |
      Number of worker processes training different protein targets in parallel; the allocated CPUs
      are divided among them. -1 uses one process per allocated CPU (each with one thread), which is
      several times faster than one target at a time with all threads.
engines:
  - type: docker
    image: nvidia/cuda:12.8.1-cudnn-runtime-ubuntu24.04
    setup:
      - type: apt
        packages: [python3, python3-venv, procps, git, libgomp1]
      - type: docker
        run: python3 -m venv /opt/venv
      - type: docker
        env: [PATH=/opt/venv/bin:$PATH]
      - type: python
        packages:
          - tensorflow[and-cuda]>=2.20
          - anndata
          - scanpy
          - pyyaml
          - requests
          - jsonschema
          - lightgbm>=4.0
          - scikit-learn>=1.1
          - joblib>=1.4
          - mudata>=0.2
          - muon>=0.1
          - fast-array-utils
        github:
          - openproblems-bio/core#subdirectory=packages/python/openproblems
      - type: docker
        run: pip install --no-cache-dir --no-deps git+https://github.com/lueckenlab/senkin-tmp-cite-pred.git@9826aae71d9d1584247ee21b8f39d244b0329af4
runners:
  - type: executable
  - type: nextflow
    directives:
      label: [highmem, hightime, midcpu, gpu]
# Override the api default (bmmc_cite/swap = ADT->GEX). senkin only supports GEX->ADT.
test_resources:
  - type: python_script
    path: /common/component_tests/run_and_check_output.py
  - path: /resources_test/task_predict_modality/openproblems_neurips2021/bmmc_cite/normal
    dest: resources_test/task_predict_modality/openproblems_neurips2021/bmmc_cite/normal
