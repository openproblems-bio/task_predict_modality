name: "run_benchmark"
namespace: "workflows"
argument_groups:
  - name: Inputs
    arguments:
      - name: "--input_train_mod1"
        __merge__: /src/api/file_train_mod1.yaml
        required: true
        direction: input
      - name: "--input_train_mod2"
        __merge__: /src/api/file_train_mod2.yaml
        required: true
        direction: input
      - name: "--input_test_mod1"
        __merge__: /src/api/file_test_mod1.yaml
        required: true
        direction: input
      - name: "--input_test_mod2"
        __merge__: /src/api/file_test_mod2.yaml
        required: true
        direction: input
  - name: Outputs
    arguments:
      - name: "--output_scores"
        type: file
        required: true
        direction: output
        description: A yaml file containing the scores of each of the methods
        default: score_uns.yaml
      - name: "--output_method_configs"
        type: file
        required: true
        direction: output
        default: method_configs.yaml
      - name: "--output_metric_configs"
        type: file
        required: true
        direction: output
        default: metric_configs.yaml
      - name: "--output_dataset_info"
        type: file
        required: true
        direction: output
        default: dataset_uns.yaml
      - name: "--output_task_info"
        type: file
        required: true
        direction: output
        default: task_info.yaml
  - name: Method filtering
    description: |
      Use these arguments to filter methods by name. By default, all methods are
      run. If `--methods_include` is defined, only those methods are run. If
      `--methods_exclude` is defined, all methods except those specified are run.
      These arguments are mutually exclusive, so only `--methods_include` OR
      `--methods_exclude` can set but not both.
    arguments:
      - name: "--paramsets"
        type: file
        direction: input
        required: false
        description: |
          A yaml file mapping method ids to named parameter sets, e.g.:

            cellmapper_linear:
              pca_hvg:
                fallback_representation: joint_pca
                mask_var: hvg
              cca_hvg:
                fallback_representation: fast_cca
                mask_var: hvg

          Each listed method is run once per parameter set, with the given arguments
          and with `paramset_name`/`paramset` attached to its scores.
          If not provided, the parameter sets default to the `info.variants`
          defined in the method components' configs. A method without
          `info.variants` is run once with its default parameter set.
      - name: "--methods_include"
        type: string
        multiple: true
        description: |
          A list of method ids to include. If specified, only these methods will be run.
          For parameterised methods, a single paramset can be targeted as `<method_id>.<paramset_name>`, e.g. `cellmapper_linear.cellmapper-pca`.
      - name: "--methods_exclude"
        type: string
        multiple: true
        description: |
          A list of method ids to exclude. If specified, all methods except the ones listed will be run.
          For parameterised methods, a single paramset can be excluded as `<method_id>.<paramset_name>`, e.g. `cellmapper_linear.cellmapper-pca`.
  - name: Metric filtering
    description: |
      Use these arguments to filter metrics by name. By default, all metrics are
      run. If `--metrics_include` is defined, only those metrics are run. If
      `--metrics_exclude` is defined, all metrics except those specified are run.
      These arguments are mutually exclusive, so only `--metrics_include` OR
      `--metrics_exclude` can set but not both.
    arguments:
      - name: "--metrics_include"
        type: string
        multiple: true
        description: |
          A list of metric ids to include. If specified, only these metrics will be run.
      - name: "--metrics_exclude"
        type: string
        multiple: true
        description: |
          A list of metric ids to exclude. If specified, all metrics except the ones listed will be run.
resources:
  - type: nextflow_script
    path: main.nf
    entrypoint: run_wf
  - type: file
    path: /_viash.yaml
  - path: /common/nextflow_helpers/helper.nf
dependencies:
  - name: utils/extract_uns_metadata
    repository: openproblems
  - name: control_methods/mean_per_gene
  - name: control_methods/random_predict
  - name: control_methods/zeros
  - name: control_methods/solution
  - name: methods/knnr_py
  - name: methods/knnr_r
  - name: methods/cellmapper_linear
  - name: methods/cellmapper_scvi
  - name: methods/lm
  - name: methods/guanlab_dengkw_pm
  - name: methods/novel
  - name: methods/simple_mlp
  - name: methods/babel
  - name: methods/senkin_tmp
  - name: methods/scbutterfly
  - name: methods/ss_opm
  - name: methods/scipenn
  - name: metrics/correlation
  - name: metrics/mse
runners:
  - type: nextflow